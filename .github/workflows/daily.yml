name: 每日净值更新

on:
  schedule:
    # UTC 12:30 = 北京时间 20:30，周一至周五
    - cron: "30 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write      # 回写 docs/data.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取净值并计算
        run: python scripts/fetch.py

      - name: 回写数据到仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "data: 更新净值快照 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 打包页面
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
